name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend API tests (Express + Prisma)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medbridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Configure env
        run: |
          cat > .env <<EOF
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/medbridge_test"
          JWT_SECRET="ci-only-$(openssl rand -hex 32)"
          ML_SERVICE_URL="http://localhost:8000"
          NODE_ENV=test
          EOF
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------- Frontend
  frontend:
    name: Frontend build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------- ML service
  ml:
    name: ML pipeline (generate → train → test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml-service/requirements.txt
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Generate dataset (deploy profile)
        env:
          MEDBRIDGE_START_DATE: "2025-03-01"
          MEDBRIDGE_END_DATE: "2026-06-30"
          MEDBRIDGE_DEMO_ONLY: "1"
        run: python training/generate_ledger_data.py
      - name: Train XGBoost model
        env:
          MEDBRIDGE_START_DATE: "2025-03-01"
          MEDBRIDGE_END_DATE: "2026-06-30"
          MEDBRIDGE_DEMO_ONLY: "1"
        run: python training/train_xgb.py
      - name: Run test suite (leakage guard, smoke, model load, seed)
        run: python -m pytest tests/ -q
      - name: API smoke test
        run: |
          (uvicorn app.api.server:app --port 8000 &) && sleep 5
          curl -fsS http://127.0.0.1:8000/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d; print('ML /health ok:', d['status'])"
